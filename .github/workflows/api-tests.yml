name: API Tests  # Название workflow в интерфейсе GitHub


on:
  push:
    branches: [main, master]  # Запуск при пуше в main/master
  pull_request:
    branches: [main, master]  # Запуск при PR в main/master
  workflow_dispatch:           # Возможность ручного запуска

jobs:
  run-api-tests:
    runs-on: ubuntu-latest     # ОС для выполнения

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Postman tests via Newman
        run: |
          newman run \
            postman/collection.json \
            -e postman/environment.json \
            --reporters cli,junit \
            --reporter-junit-export test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7
